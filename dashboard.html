<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExamSentry 감독관</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#16181d;--mute:#667085;--line:#d9dde3;--room:#eef1f5;
--high:#d92d20;--high-bg:#fde8e7;--watch:#b54708;--watch-bg:#fef0c7;--low:#667085;--low-bg:#f2f4f7;--ok:#079455;--accent:#2e5bff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--panel:#171a21;--ink:#eceff4;--mute:#98a2b3;--line:#2a2f3a;--room:#1d212a;
--high:#ff6b5e;--high-bg:#3a1714;--watch:#fdb022;--watch-bg:#33260c;--low:#98a2b3;--low-bg:#222630;--ok:#32d583;--accent:#7b9bff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:700}
.phase{padding:4px 12px;border-radius:999px;background:var(--low-bg);font-weight:600}
.phase.exam{background:var(--accent);color:#fff}
.phase.break{background:var(--high);color:#fff}
.clock{font-variant-numeric:tabular-nums;color:var(--mute)}
.bar{flex:1;min-width:120px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.ctl{display:none;gap:8px}
.ctl button{font:inherit;font-size:14px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr);gap:16px;padding:16px 20px}
@media (max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
#banner{display:none;grid-column:1/-1;background:var(--high-bg);border:2px solid var(--high);color:var(--ink);border-radius:14px;padding:14px 18px;font-size:18px}
#banner b{color:var(--high)}
svg{width:100%;height:auto;display:block}
.zone{fill:var(--room);stroke:var(--line);stroke-width:2}
.zone.high{fill:var(--high-bg);stroke:var(--high);stroke-width:4}
.zone.watch{fill:var(--watch-bg);stroke:var(--watch);stroke-width:3}
.lbl{fill:var(--mute);font-size:26px;text-anchor:middle}
.sensor{stroke:var(--panel);stroke-width:4}
.sl{fill:var(--ink);font-size:22px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.dot{stroke:var(--panel);stroke-width:3}
.dt{fill:#fff;font-size:20px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.list{display:flex;flex-direction:column;gap:10px}
.sig{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--line)}
.sig.high{border-color:var(--high);background:var(--high-bg)}
.sig.watch{border-color:var(--watch);background:var(--watch-bg)}
.no{font-weight:700;font-size:20px;min-width:40px}
.where{font-weight:700;font-size:18px}
.meta{grid-column:2/4;color:var(--mute);font-size:14px}
.lv{font-weight:700;padding:2px 10px;border-radius:999px;font-size:14px;color:#fff}
.lv.high{background:var(--high)}.lv.watch{background:var(--watch)}.lv.low{background:var(--low)}
.quiet{color:var(--mute);font-size:14px;padding:4px 2px}
.foot{color:var(--mute);font-size:13px;margin-top:10px}
.err{color:var(--high)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .8s linear}}
</style>
</head>
<body>
<header>
  <h1>ExamSentry · 감독관</h1>
  <span id="phase" class="phase">연결 중</span>
  <span id="clock" class="clock"></span>
  <div class="bar"><i id="prog"></i></div>
  <div class="ctl" id="ctl">
    <button data-c="baseline">기준선</button><button data-c="start">시험 시작</button>
    <button data-c="end">쉬는 시간</button><button data-c="reset">초기화</button>
  </div>
</header>
<main>
  <div id="banner"></div>
  <section class="card">
    <svg viewBox="0 0 1000 830" role="img" aria-label="교실 배치도">
      <rect class="zone" id="z-앞왼쪽" x="50" y="60" width="450" height="300"/>
      <rect class="zone" id="z-앞오른쪽" x="500" y="60" width="450" height="300"/>
      <rect class="zone" id="z-뒤왼쪽" x="50" y="360" width="450" height="300"/>
      <rect class="zone" id="z-뒤오른쪽" x="500" y="360" width="450" height="300"/>
      <ellipse class="zone" id="z-가운데" cx="500" cy="360" rx="126" ry="84"/>
      <rect class="zone" id="z-복도" x="50" y="690" width="900" height="120" rx="8"/>
      <text class="lbl" x="500" y="40">칠판</text>
      <text class="lbl" x="275" y="215">앞왼쪽</text><text class="lbl" x="725" y="215">앞오른쪽</text>
      <text class="lbl" x="275" y="515">뒤왼쪽</text><text class="lbl" x="725" y="515">뒤오른쪽</text>
      <text class="lbl" x="500" y="368">가운데</text><text class="lbl" x="500" y="758">복도</text>
      <g id="dots"></g>
      <g id="sensors"></g>
    </svg>
    <div class="foot" id="sensorTxt"></div>
  </section>
  <section class="card">
    <div class="list" id="list"></div>
    <div class="foot" id="foot"></div>
  </section>
</main>
<script>
const ZC={"앞왼쪽":[275,250],"앞오른쪽":[725,250],"뒤왼쪽":[275,550],"뒤오른쪽":[725,550],"가운데":[500,320],"복도":[500,725],"보류":[500,320]};
const SP={A:[50,60],B:[950,60],C:[50,660],D:[950,660]};
const CLS={"높음":"high","관찰":"watch","낮음":"low"};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let live=false;
document.querySelectorAll("#ctl button").forEach(b=>b.onclick=()=>fetch("/control/"+b.dataset.c,{method:"POST"}).then(poll));

function render(s){
  live=s.mode==="live"; $("ctl").style.display=live?"flex":"none";
  const ph=$("phase"); ph.textContent=s.phase;
  ph.className="phase"+(s.phase==="시험 중"?" exam":s.phase==="쉬는 시간"?" break":"");
  $("clock").textContent=s.exam_min!=null?`${Math.floor(s.exam_min)}분 / ${s.exam_total}분`:"";
  $("prog").style.width=Math.min(100,100*(s.exam_min||0)/(s.exam_total||50))+"%";
  const sig=s.signals||[], br=s.phase==="쉬는 시간";
  // 구역 색
  document.querySelectorAll(".zone").forEach(z=>z.classList.remove("high","watch"));
  const zl={};
  sig.forEach(x=>{const r=x.level==="높음"?2:x.level==="관찰"?1:0;if(r>(zl[x.near]||0))zl[x.near]=r});
  for(const [z,r] of Object.entries(zl)){const el=$("z-"+z);if(el&&z!=="복도")el.classList.add(r===2?"high":r===1?"watch":"x")}
  // 점
  const shown=sig.filter(x=>x.level!=="낮음"||x.active), cnt={};
  $("dots").innerHTML=shown.map(x=>{const c=ZC[x.near]||ZC["보류"];const k=cnt[x.near]=(cnt[x.near]||0)+1;
    const cx=c[0]+((k-1)%3-1)*56, cy=c[1]+Math.floor((k-1)/3)*56;
    const col=x.level==="높음"?"var(--high)":x.level==="관찰"?"var(--watch)":"var(--low)";
    return `<circle class="dot" cx="${cx}" cy="${cy}" r="24" fill="${col}"/><text class="dt" x="${cx}" y="${cy}">${x.no}</text>`}).join("");
  // 센서
  const age=s.sensor_age||{};
  $("sensors").innerHTML=Object.entries(SP).map(([k,[x,y]])=>{const a=age[k];const ok=a!=null&&a<5;
    return `<circle class="sensor" cx="${x}" cy="${y}" r="26" fill="${ok?"var(--ok)":"var(--high)"}"/><text class="sl" x="${x}" y="${y}">${k}</text>`}).join("");
  const dead=Object.entries(age).filter(([k,a])=>a==null||a>=5).map(([k])=>k);
  $("sensorTxt").innerHTML=dead.length?`<span class="err">센서 ${dead.join(", ")} 응답 없음 — 전원·케이블 확인</span>`:"센서 4대 정상";
  // 목록
  const top=sig.filter(x=>x.level!=="낮음"), low=sig.filter(x=>x.level==="낮음");
  $("list").innerHTML=(top.length?top.map(x=>`
    <div class="sig ${CLS[x.level]}">
      <span class="no">#${x.no}</span>
      <span class="where">${esc(x.near)} 부근</span>
      <span class="lv ${CLS[x.level]}">${x.level}</span>
      <span class="meta">${x.kind==="WIFI"?"Wi-Fi":"BLE"} · ${esc(x.why)}${x.macs>1?` · MAC ${x.macs}번 바뀜`:""}${x.active?"":" · 지금은 안 잡힘"}</span>
    </div>`).join(""):`<div class="quiet">${s.phase==="시험 중"?"아직 의심 신호 없음":"표시할 신호 없음"}</div>`)
    +(low.length?`<div class="quiet">낮음 ${low.length}개 (복도 통행·짧은 신호) — 확인 불필요</div>`:"");
  $("foot").innerHTML=`시험 전 기준선 신호 ${s.baseline_count||0}개 제외 · 갱신 ${esc(s.updated||"")}`+(s.error?` · <span class="err">오류: ${esc(s.error)}</span>`:"");
  // 쉬는 시간 배너
  const hi=sig.filter(x=>x.level==="높음");
  $("banner").style.display=br&&hi.length?"block":"none";
  if(br&&hi.length)$("banner").innerHTML="쉬는 시간입니다. 확인할 곳: "+hi.map(x=>`<b>${esc(x.near)} 부근</b> (#${x.no}, 교실 안 ${Math.round(x.minutes)}분)`).join(", ");
}
function poll(){fetch("/state",{cache:"no-store"}).then(r=>r.json()).then(render).catch(()=>{$("phase").textContent="서버 연결 끊김";$("phase").className="phase break"})}
poll();setInterval(poll,1000);
</script>
</body>
</html>
